name: PDKS anlık senkronizasyon

# Vercel Hobby planı cron'u günde bire sınırlıyor (bkz. vercel.json). Kimse
# uygulamayı açık tutmadığında veri işlenmeden birikmesin diye bu ücretsiz
# GitHub Actions döngüsü /api/cron'u sık aralıklarla çağırıyor. Uç nokta zaten
# idempotent ve veritabanı kilitli (bkz. lib/sync/autoSync.ts) — yapılacak iş
# yoksa iki küçük sorguyla saniyeler içinde çıkıyor, üst üste çağrılması
# sorun oluşturmaz.
on:
  schedule:
    - cron: "*/3 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: /api/cron'u tetikle
        run: |
          # -f yerine kodu elle kontrol ediyoruz: -f bir hata durumunda gövdeyi
          # sessizce atıyor, "exit code 22" dışında hiçbir teşhis vermiyordu.
          # --max-time 60: tam yeniden hesaplama devam ederken bir tur 30-40 sn
          # sürebiliyor (canlıda ölçüldü); daha kısa bir sınır burada yanlış
          # yere "başarısız" gösterirdi.
          http_code=$(curl -s --max-time 60 -o response.json -w "%{http_code}" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}" \
            https://nc-pdks.vercel.app/api/cron)
          echo "HTTP $http_code"
          echo "--- yanıt ---"
          cat response.json
          echo
          if [ "$http_code" != "200" ]; then
            if [ "$http_code" = "401" ]; then
              echo "::error::401 Yetkisiz — SYNC_SECRET reposu ayarlarındaki (Settings > Secrets and variables > Actions) değerle Vercel'deki değer uyuşmuyor. Secrets and variables > Actions sayfasından SYNC_SECRET'i kontrol edin."
            else
              echo "::error::Beklenmeyen HTTP $http_code — yukarıdaki yanıt gövdesine bakın."
            fi
            exit 1
          fi
